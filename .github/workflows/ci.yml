name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC: drift check only
  # Called by translify-pull-on-publish.yml to build the pulled files on their branch before they are merged.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the pull-on-publish branch); empty builds the event's ref
        type: string
        required: false
        default: ''

concurrency:
  # A build called by translify-pull-on-publish.yml for a pulled branch gets its own group, not main's.
  group: ci-${{ inputs.ref || github.ref }}
  # Only PR runs are superseded by a newer push; a scheduled drift run must never be cancelled by a merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react-i18next-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples/react-i18next-runtime } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: examples/react-i18next-runtime/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The VITE_* values are read at page load, not at build time, so the build needs none of them.
      - run: pnpm build

  flutter-arb:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples/flutter-arb } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web # the README's run target; a missing platform folder fails here, not on a visitor

  angular-xliff:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples/angular-xliff } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: examples/angular-xliff/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check

  android-xml:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples/android-xml } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # The hosted image sets ANDROID_HOME with build-tools and platforms; verify.sh picks the highest of each.
      - run: ./verify.sh

  # Weekly, not per PR: Actions minutes are a shared pool across the Translify repos.
  # The CLI is pinned so a breaking 0.x release cannot turn this job red for reasons unrelated to drift.
  # examples/* are pulled from the production environment by translify-pull-on-publish.yml, so their drift is
  # measured against what is live (`--from env:production`); catalog/ is the working copy it pushes.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: catalog
        run: npx -y @chesterbrains/translify-cli@0.8.0 status
        working-directory: catalog
        env: { TRANSLIFY_SECRET_KEY: '${{ secrets.TRANSLIFY_SECRET_KEY }}' }
      - name: flutter-arb
        run: npx -y @chesterbrains/translify-cli@0.8.0 status --from env:production
        working-directory: examples/flutter-arb
        env: { TRANSLIFY_SECRET_KEY: '${{ secrets.TRANSLIFY_SECRET_KEY }}' }
      - name: angular-xliff
        run: npx -y @chesterbrains/translify-cli@0.8.0 status --from env:production
        working-directory: examples/angular-xliff
        env: { TRANSLIFY_SECRET_KEY: '${{ secrets.TRANSLIFY_SECRET_KEY }}' }
      - name: ios-xcstrings
        run: npx -y @chesterbrains/translify-cli@0.8.0 status --from env:production
        working-directory: examples/ios-xcstrings
        env: { TRANSLIFY_SECRET_KEY: '${{ secrets.TRANSLIFY_SECRET_KEY }}' }
      - name: android-xml
        run: npx -y @chesterbrains/translify-cli@0.9.0 status --from env:production
        working-directory: examples/android-xml
        env: { TRANSLIFY_SECRET_KEY: '${{ secrets.TRANSLIFY_SECRET_KEY }}' }
      - name: ios-strings
        run: npx -y @chesterbrains/translify-cli@0.10.1 status --from env:production
        working-directory: examples/ios-strings
        env: { TRANSLIFY_SECRET_KEY: '${{ secrets.TRANSLIFY_SECRET_KEY }}' }
