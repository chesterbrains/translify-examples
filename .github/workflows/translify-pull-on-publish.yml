# Translify: pull on publish (the catalog/ demo project).
# Copied from translify-cli/recipes/github-actions/translify-pull-on-publish.yml, split into three jobs so the
# Build step is ci.yml called as a reusable workflow; the CLI is pinned like the other jobs.
#
# When Acme Ecom's production environment is published, the project's GitHub webhook sends a repository_dispatch
# here. The `pull` job pulls `env:production` into the three build-time examples (catalog/ is the source that gets
# pushed, never pulled; react-i18next-runtime has no files), commits them on one branch per batch and opens a pull
# request with the publish summary. `build` runs ci.yml on that branch; `merge` merges when it passed.
#
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests" (Settings → Actions →
# General). The build and the merge run inside this workflow because a pull request opened with GITHUB_TOKEN never
# triggers other workflows. `translify.ping` (Send test) is not listened to.
name: Translify pull on publish

on:
  repository_dispatch:
    types: [translify.publication]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Per environment: a pending run is replaced by a newer one in its group, so another environment's dispatch must
  # never take the place of a pending publish of the one this repository follows.
  group: translify-pull-on-publish-${{ github.event.client_payload.environment.slug }}
  # Publishes run one after the other, never cancelled: each one pulls what is live when it runs.
  cancel-in-progress: false

jobs:
  pull:
    # The environment this repository follows. A publish of any other environment is skipped.
    if: github.event.client_payload.environment.slug == 'production'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      branch: ${{ steps.diff.outputs.branch }}
    env:
      SLUG: ${{ github.event.client_payload.environment.slug }}
      SEQ: ${{ github.event.client_payload.batch.seq }}
      # The whole payload, read with jq below; never interpolated into a script.
      PAYLOAD: ${{ toJSON(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # One `run:` with `set -e`: a pull that fails in any example stops before anything is committed.
      - name: Pull
        run: |
          set -euo pipefail
          for dir in examples/flutter-arb examples/angular-xliff examples/ios-xcstrings; do
            echo "::group::$dir"
            (cd "$dir" && npx -y @chesterbrains/translify-cli@0.8.0 pull --from env:"$SLUG")
            echo "::endgroup::"
          done
        env:
          TRANSLIFY_SECRET_KEY: ${{ secrets.TRANSLIFY_SECRET_KEY }}

      # A publish that changed nothing these examples pull ends here.
      - name: Detect changes
        id: diff
        run: |
          echo "branch=translify/publish-$SLUG-$SEQ" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit: the files already match $SLUG."
          fi

      # One branch per batch, so a resent delivery rewrites the same branch instead of failing.
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.diff.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(i18n): pull $SLUG after batch #$SEQ from Translify"
          # --force, not --force-with-lease: checkout fetched only the default branch, so a lease has no remote
          # ref to compare with and rejects every rewrite (a re-run after a failed step). The branch is the bot's.
          git push --force origin HEAD

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.diff.outputs.branch }}
        run: |
          title="$(jq -r '"Translify: \(.environment.name) after batch #\(.batch.seq) (\(.batch.kind))"' <<<"$PAYLOAD")"
          # Pipes would break the table; back-slash them in the free-text fields.
          jq -r '
            def cell: tostring | gsub("\\|"; "\\|");
            "Pulled **\(.environment.name | cell)** (`\(.environment.slug | cell)`) after batch **#\(.batch.seq)** (`\(.batch.kind)`) by \(.actor.name | cell) (\(.actor.type)).",
            "The files are what was live when this run pulled, which may already include a later batch.",
            "",
            "| Published | Added | Changed | Removed | Withheld | Errors |",
            "|---|---|---|---|---|---|",
            "| \(.batch.publishedCount) | \(.batch.addedCount) | \(.batch.changedCount) | \(.batch.removedCount) | \(.batch.withheldCount) | \(.batch.errorCount) |",
            "",
            "Delivery `\(.id)` · \(.createdAt) · project `\(.project.slug | cell)`"
          ' <<<"$PAYLOAD" > body.md
          if gh pr view "$BRANCH" --json number > /dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$title" --body-file body.md
          elif ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md; then
            echo '::error::Could not open the pull request. Enable "Allow GitHub Actions to create and approve pull requests" in Settings → Actions → General.'
            exit 1
          fi

  # The examples' own CI, on the pulled branch: the files must build before they reach main.
  build:
    needs: pull
    if: needs.pull.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.pull.outputs.branch }}

  merge:
    needs: [pull, build]
    if: needs.pull.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.pull.outputs.branch }}
