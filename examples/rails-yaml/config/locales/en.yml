---
en:
  app:
    cart:
      heading: :app.cart.title
      title: Your cart
    greeting: Hello %{name}
    items:
      one: "%{count} item"
      other: "%{count} items"
      zero: No items
    welcome_html: "<b>Welcome</b> back"
  date:
    abbr_month_names:
    -
    - Jan
    - Feb
    - Mar
    - Apr
    - May
    - Jun
    - Jul
    - Aug
    - Sep
    - Oct
    - Nov
    - Dec
    day_names:
    - Sunday
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    - Saturday
    formats:
      default: "%Y-%m-%d"
      short: "%b %d"
    order:
    - :year
    - :month
    - :day
  number:
    format:
      delimiter: ","
      precision: 3
      separator: "."
      strip_insignificant_zeros: false
